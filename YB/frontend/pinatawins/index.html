  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (!params.get('code')) {
        params.set('lang', params.get('lang') || 'en');
        params.set('code', 'cXO0E8snVT');
        params.set('backurl', params.get('backurl') || 'openurl://closegame');
        window.location.replace(window.location.pathname + '?' + params.toString());
      }
    })();
  </script>
  <script>
    (function () {
      var isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      var params = new URLSearchParams(window.location.search);
      if (!isMobileDevice && window.innerWidth > 700 && params.get('embed') !== '1') {
        window.location.replace('/mobile-preview.html?' + params.toString());
      }
    })();
  </script>
  <script>
    (function () {
      if (!new URLSearchParams(window.location.search).get('debugLog')) {
        return;
      }

      function report(type, payload) {
        try {
          navigator.sendBeacon('/__client-log', JSON.stringify({
            type: type,
            payload: payload,
            href: location.href,
            time: Date.now()
          }));
        } catch (error) {
          if (window.console && console.warn) {
            console.warn('client log failed', error);
          }
        }
      }

      window.addEventListener('error', function (event) {
        report('error', {
          message: event.message,
          source: event.filename,
          line: event.lineno,
          column: event.colno
        });
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        report('unhandledrejection', String(event.reason && event.reason.message || event.reason));
      });

      var originalOpen = XMLHttpRequest.prototype.open;
      var originalSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function (method, url) {
        this.__debugMethod = method;
        this.__debugUrl = url;
        return originalOpen.apply(this, arguments);
      };
      XMLHttpRequest.prototype.send = function () {
        this.addEventListener('loadend', function () {
          try {
            var url = String(this.__debugUrl || '');
            if (!url.includes('/__client-log')) {
              var response = '';
              var responseType = this.responseType || '';
              if (responseType === '') {
                response = String(this.responseText || '').slice(0, 300);
              } else if (responseType === 'text') {
                response = String(this.response || '').slice(0, 300);
              } else if (responseType === 'arraybuffer' && url.includes('/socket.io/')) {
                try {
                  response = new TextDecoder('utf-8').decode(new Uint8Array(this.response || new ArrayBuffer(0))).slice(0, 600);
                } catch (error) {
                  response = '[socket arraybuffer decode failed: ' + error.message + ']';
                }
              } else {
                response = '[responseType=' + responseType + ']';
              }
              report('xhr', {
                method: this.__debugMethod,
                url: this.__debugUrl,
                status: this.status,
                response: response
              });
            }
          } catch (error) {
            report('debug-hook-error', String(error && error.message || error));
          }
        });
        return originalSend.apply(this, arguments);
      };
    })();
  </script>
</head>

<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.d1e6e.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.941a2.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>

<style>
#splash {
  background: #171717;
}
</style>
