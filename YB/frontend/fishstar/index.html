<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Fishing Star</title>
    <meta name="description" content="FishStar local client using original package assets." />
    <link rel="stylesheet" href="/fishstar/styles.css" />
  </head>
  <body class="is-booting">
    <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>

    <div id="splash">
      <div class="progress-bar stripes"><span id="bootProgress" style="width:0%"></span></div>
      <img id="loadingGif" alt="Loading" />
      <p id="loadingTxt">Loading, please wait patiently</p>
    </div>

    <div id="hudLayer" aria-live="polite">
      <span id="launchStatus" class="sr-status">Loading FishStar package.</span>
      <div id="controlHitTargets">
        <button id="decreaseBet" class="canvas-hit-target" type="button" aria-label="Decrease bet"></button>
        <button id="increaseBet" class="canvas-hit-target" type="button" aria-label="Increase bet"></button>
        <button id="fireButton" class="canvas-hit-target" type="button" aria-label="Fire"></button>
        <button id="syncButton" class="canvas-hit-target" type="button" aria-label="Sync balance"></button>
        <button id="historyButton" class="canvas-hit-target" type="button" aria-label="History"></button>
        <button id="muteButton" class="canvas-hit-target" type="button" aria-label="Toggle sound"></button>
      </div>
      <div id="historyPanel" class="history-panel">
        <button id="closeHistory" type="button">×</button>
        <ul id="historyList"></ul>
      </div>
    </div>

    <script type="module" src="/fishstar/launcher.js"></script>
  </body>
</html>
