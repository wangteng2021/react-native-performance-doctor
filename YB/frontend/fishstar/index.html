    <script>
      (function () {
        var incoming = new URLSearchParams(window.location.search);
        var queryParams = new URLSearchParams();
        queryParams.set("gsp", "101");
        queryParams.set("sceneMode", "2");
        queryParams.set("adaption", "1");
        queryParams.set("currencyIcon", "diamondIcon.png");
        queryParams.set("aspectRatio", "1");
        queryParams.set("gameMode", incoming.get("gameMode") || "2");
        queryParams.append("gameId", "FishStar");
        queryParams.set("appId", "7990057035");
        queryParams.set("appChannel", "chatna");
        queryParams.set("roomId", incoming.get("roomId") || "85422171");
        var fishstarUserId = incoming.get("userId") || incoming.get("fishstarUserId");
        if (fishstarUserId) queryParams.set("userId", fishstarUserId);
        queryParams.set("lang", "2");
        queryParams.set("language", "2");
        queryParams.set("code", incoming.get("fishstarCode") || incoming.get("code") || "3489b80a-925c-413b-8813-8c8d7b0fa14e");
        queryParams.set("isDataByUrl", "1");
        if (incoming.get("embed")) queryParams.set("embed", incoming.get("embed"));
        if (incoming.get("backurl")) queryParams.set("backurl", incoming.get("backurl"));
        queryParams.append("gameId", "FishStar");
        var query = queryParams.toString();
        if (window.location.search.slice(1) !== query) {
          window.history.replaceState(null, '', window.location.pathname + '?' + query + window.location.hash);
        }
      })();
    </script>
    <script>
      (function () {
        var loadedSent = false;

        function postNative(name, payload) {
          try {
            var webkit = window.webkit;
            var handlers = webkit && webkit.messageHandlers;
            var handler = handlers && handlers[name];
            if (handler && typeof handler.postMessage === "function") {
              handler.postMessage(payload || {});
              return true;
            }
          } catch (error) {
            console.warn("FishStar native bridge failed:", name, error);
          }
          return false;
        }

        function basePayload(extra) {
          var query = {};
          var params = new URLSearchParams(window.location.search);
          params.forEach(function (value, key) {
            query[key] = value;
          });
          var payload = {
            gameId: "fishstar",
            href: window.location.href,
            query: query,
            ts: Date.now()
          };
          if (extra && typeof extra === "object") {
            Object.keys(extra).forEach(function (key) {
              payload[key] = extra[key];
            });
          }
          return payload;
        }

        window.FishStarNativeBridge = {
          post: function (name, payload) {
            return postNative(name, basePayload(payload));
          },
          getConfig: function (payload) {
            return postNative("getConfig", basePayload(payload));
          },
          destroy: function (payload) {
            return postNative("destroy", basePayload(payload));
          },
          gameRecharge: function (payload) {
            return postNative("gameRecharge", basePayload(payload));
          },
          gameLoaded: function (payload) {
            if (loadedSent) return false;
            loadedSent = true;
            return postNative("gameLoaded", basePayload(payload));
          },
          onConfig: function (config) {
            window.FishStarNativeConfig = config || {};
          },
          onBalanceUpdate: function (payload) {
            window.FishStarNativeBalance = payload || {};
            window.dispatchEvent(new CustomEvent("fishstar:nativeBalanceUpdate", { detail: window.FishStarNativeBalance }));
          }
        };

        window.onFishStarConfig = window.FishStarNativeBridge.onConfig;
        window.onBalanceUpdate = window.FishStarNativeBridge.onBalanceUpdate;
        window.requestGameRecharge = function (payload) {
          return window.FishStarNativeBridge.gameRecharge(payload);
        };
        window.closeFishStarGame = function (payload) {
          return window.FishStarNativeBridge.destroy(payload);
        };
        window.addEventListener("load", function () {
          window.FishStarNativeBridge.gameLoaded({ phase: "window.load" });
          window.FishStarNativeBridge.getConfig({ phase: "window.load" });
        });
      })();
    </script>

<body>
<canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
<div id="splash" style="display: none;">
    <div class="progress-bar stripes">
        <span style="width: 0%"></span>
    </div>
    <img id="loading" src="loading.08f4a.gif">
    <p id="loadingTxt" style="display: none;">Loading, please wait patiently</p>

<script type="text/javascript">
    (function () {
        // open web debugger console
        if (typeof VConsole !== 'undefined') {
            window.vConsole = new VConsole();
        }
        var BSUtils = window.BSUtils;
        var debug = window._CCSettings.debug;
        window.TRANSPARENT_CANVAS_BS = true;
        window['isUnity'] = false;
        function loadScript(moduleName, cb) {
            function scriptLoaded() {
                document.body.removeChild(domScript);
                domScript.removeEventListener('load', scriptLoaded, false);
                cb && cb();
            };
            var domScript = document.createElement('script');
            domScript.async = true;
            domScript.src = moduleName;
            domScript.addEventListener('load', scriptLoaded, false);
            document.body.appendChild(domScript);
        }

        loadScript(debug ? "cocos2d-js.js" : "cocos2d-js-min.fecee.js", function () { 
            if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
                loadScript(debug ? 'physics.js' : 'physics-min.js', function () {
                    window.boot();
                    window.FishStarNativeBridge && window.FishStarNativeBridge.gameLoaded({ phase: 'boot' });
                });
            } else {
                window.boot();
                window.FishStarNativeBridge && window.FishStarNativeBridge.gameLoaded({ phase: 'boot' });
            }
        });

        var params = BSUtils.GetUrlParams(window.location.href);
        var splash = document.getElementById('splash');
        var loading = document.getElementById('loading');
        var loadingTxt = document.getElementById('loadingTxt');
        if (JSON.stringify(params) !== "{}") {
            if (params.gameMode) {
                splash.style.display = 'block';
                if (["honeycam", "boloji", "weile"].includes(params.appChannel)) {
                    loadingTxt.style.display = 'block';
                    if (params.appChannel === "weile") {
                        var loadingTxtTop = '50px';
                        var loadingTxt_wei = "The game does not offer \"real money gambling\" or an opportunity to win real money or prizes.";
                        if(params.language){
                            var language = parseInt(params.language);
                            if(language === 1){
                                loadingTxtTop = '35px';
                                loadingTxt_wei = "遊戲不提供「現金交易賭博」，也沒有機會贏得現金或實體獎品。"
                            }else if(language === 3){
                                loadingTxt_wei = "Game ini tidak menawarkan \"perjudian uang sungguhan\" atau peluang untuk memenangkan uang sungguhan atau hadiah.";
                            }else if(language === 5){
                                loadingTxtTop = '35px';
                                loadingTxt_wei = "เกมนี้ไม่มี \"การพนันด้วยเงินจริง\" หรือโอกาสในการชนะเงินหรือรางวัลจริง";
                            }else if(language === 6){
                                loadingTxt_wei = "Trò chơi không cung cấp hoạt động \"\"đánh bạc bằng tiền thật\"\" hoặc cơ hội để giành chiến thắng tiền thật hoặc giải thưởng tiền mặt.";
                            }
                        }
                        loadingTxt.style.marginTop = loadingTxtTop;
                        loadingTxt.innerHTML = loadingTxt_wei;
                    }
                }
                if (params.gameMode == '2') {
                    splash.style.backgroundImage = "url('minibg.c5b69.jpg')";
                    var realHalfScrren = ['halolive', 'ishow', 'hilla', 'timo', 'nonolive'];
                    var isAutoAdapt = false;
                    if (realHalfScrren.includes(params.appChannel) || params.adaption == '1' || isAutoAdapt) {
                        splash.style.backgroundSize = "100% 100%";
                    } else {
                        splash.style.backgroundPosition = "0% 0%"
                        splash.style.bottom = "-58%"
                        loading.style.top = "21%"
                        loadingTxt.style.top = "21%"
                    }
                } else if (params.gameMode == '3') {
                    splash.style.backgroundImage = "url('bigbg.1d9fd.jpg')";
                    splash.style.backgroundSize = "100% 100%";
                }
            } else {
                splash.style.display = 'none';
            }
            //上报进度
            if (BSUtils) {
                //加载report
                BSUtils.loadReport(() => {
                    //初始化report
                    var gameId = 1022;
                    var env = 1;
                    var appChannel = '';
                    if(params.appChannel){
                        appChannel = params.appChannel;
                    } else if(params.alias){
                        appChannel = params.alias;
                    }
                    BSUtils.initReport(appChannel, gameId, env);
                    //上报节点1
                    BSUtils.reportProcess(1,params.appId ? params.appId : 0,params.userId ? params.userId : '')
                    var canvas = document.createElement('canvas');
                    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) {
                        console.log('支持WebGL')
                    } else {
                        BSUtils.reportProcess(7,params.appId ? params.appId : 0,params.userId ? params.userId : '')
                    }
                })
                //加载渠道
                BSUtils.loadAppChannel(()=>{
                    let channel = params.appChannel;
                    if (params.alias){
                        channel = params.alias;
                    }
                    BSUtils.initAppChannel(channel);
                })
            }
            //Unity
            if(params.isUnity && params.isUnity === '1'){
                window['isUnity'] = true;
            }
        } else {
            splash.style.display = 'none';
        }
    })();

    function closeLoadingBg() {
        var splash = document.getElementById('splash');
        if (splash) {
            splash.style.display = 'none';
        }
    }

    function showShaderRect(rects) {
        for (var i in rects) {
            let obj = rects[i];
            if (obj) {
                var shaderRect = document.createElement("div");
                shaderRect.setAttribute("id", "shaderRect");
                document.body.appendChild(shaderRect);
                shaderRect.style.position = 'absolute';
                shaderRect.style.backgroundColor = 'rgba(0, 0, 0, 0)'

                var withNum = obj.width * 100 + '%';
                var heightNum = obj.height * 100 + '%';
                var bottomNum = obj.bottom * 100 + '%';
                var leftNum = (0.5 - obj.width / 2) * 100 + '%';
                shaderRect.style.width = withNum;
                shaderRect.style.height = heightNum;
                shaderRect.style.bottom = bottomNum;
                shaderRect.style.left = leftNum;
            }
        }
    }

    function hideShaderRect() {
        var divs = document.querySelectorAll('div')
        for (var i = 0; i < divs.length; i++) {
            var element = divs[i];
            if (element.id == 'shaderRect') {
                element.remove();
            }
        }
    }

    window.isGameOnHide = false;
    function updateVisibilityStatus() {
        window.isGameOnHide = document.hidden;
    }
    document.addEventListener('visibilitychange', updateVisibilityStatus);

</script>
